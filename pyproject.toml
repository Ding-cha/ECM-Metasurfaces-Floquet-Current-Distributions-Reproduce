[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symmetric-cross-mts"
version = "0.1.0"
description = "Analytical reproduction of a symmetric-cross MTS unit cell."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
